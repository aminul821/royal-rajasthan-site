<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up | Royal Rajasthan</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="container">
    <div class="box" role="main" aria-labelledby="signup-heading">
      <h1 id="signup-heading">Create Account</h1>
      <p class="lead">Sign up to save your favourite places and trips</p>

      <form id="signupForm" autocomplete="on" novalidate>
        <input type="text" id="signupName" name="name" placeholder="Full Name" required>

        <input type="email" id="signupEmail" name="email" placeholder="Email" required>

        <div style="position:relative">
          <input type="password" id="signupPassword" name="password" placeholder="Password (min 6 characters)" required>
          <button type="button" class="show-pass">Show</button>
        </div>

        <div style="position:relative">
          <input type="password" id="signupConfirm" name="confirm" placeholder="Confirm Password" required>
        </div>

        <div class="actions">
          <button type="submit" class="btn">SIGN UP</button>
          <a class="btn secondary" href="login.html" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">LOGIN</a>
        </div>

        <div id="authMessage" class="message"></div>
      </form>

      <a class="small-link" href="index.html">Back to Home</a>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
