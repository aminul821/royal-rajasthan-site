<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Royal Rajasthan</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{
      --primary: #E60023; 
      --primary-dark: #B0001A;
      --card-bg: #ffffff;
      --muted: #6b6b6b;
    }

    /* Pinterest-like full-screen look with centered card */
    body.auth-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font-family: "Poppins", Arial, sans-serif;
    }

    .auth-page .box{
      width:420px;
      max-width:94%;
      background:var(--card-bg);
      padding:28px;
      border-radius:12px;
      box-shadow:0 24px 60px rgba(0,0,0,0.25);
      text-align:center;
      color:#111;
    }

    .auth-page .box h1{ margin:0 0 8px; color:var(--primary); font-family:'Playfair Display',serif; }
    .auth-page .box p.lead{ color:var(--muted); margin-bottom:14px; }

    .auth-page input[type="text"],
    .auth-page input[type="password"]{
      width:100%;
      padding:10px 12px;
      margin:8px 0;
      border:1px solid #eee;
      border-radius:8px;
      font-size:15px;
    }

    .auth-page .actions{ display:flex; gap:10px; justify-content:center; margin-top:12px; }
    .auth-page .btn{
      padding:10px 18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:700;
      color:#fff;
      background: linear-gradient(90deg,var(--primary),var(--primary-dark));
      box-shadow:0 8px 18px rgba(230,0,35,0.18);
    }
    .auth-page .btn.secondary{
      background:#f2f2f2;
      color:#111;
      border:1px solid #e6e6e6;
      box-shadow:none;
    }

    .show-pass{
      position:absolute;
      right:10px;
      top:8px;
      background:transparent;
      border:none;
      color:var(--primary-dark);
      font-weight:600;
      cursor:pointer;
    }

    #message{ min-height:20px; margin-top:10px; font-size:14px; }
    #message.error{ color:#b00020; }
    #message.success{ color:#006e6e; }

    .small-link{ display:block; margin-top:14px; color:#333; text-decoration:none; font-size:14px; }
  </style>
</head>
<body class="auth-page">
  <main class="container">
    <div class="box" role="main" aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome</h1>
      <p class="lead">Login to access your profile and saved trips</p>

      <form id="loginForm" autocomplete="on" novalidate>
        <div style="position:relative">
           <input type="text" id="username" name="username" placeholder="Username or Email" required>
        </div>

        <div style="position:relative">
           <input type="password" id="password" name="password" placeholder="Password" required>
          <button type="button" class="show-pass">Show</button>
        </div>

        <div class="actions">
          <button type="submit" class="btn login-btn">LOGIN</button>
          <a class="btn secondary" href="signup.html" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">SIGN UP</a>
        </div>

        <div id="authMessage" class="message"></div>


      </form>

      <a class="small-link" href="index.html">Back to Home</a>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
